<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Servicios - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD Y CONTROL DE ACCESO (CU-6 / CU-14 / CU-18 / CU-40 / RN-34 / RN-35) -->
    <script>
        if (!localStorage.getItem('usuarioLogueado')) {
            window.location.replace('/'); 
        }
        window.addEventListener('pageshow', function(event) {
            if (!localStorage.getItem('usuarioLogueado')) {
                window.location.replace('/'); 
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.querySelectorAll('nav a[href="registro-empleado.html"], nav a[href="registro-usuario.html"], nav a[href="registro-catalogo-servicio.html"]').forEach(el => el.style.display = 'none');
                const adminCont = document.querySelector('.admin-container') || document.querySelector('form');
                if (adminCont) adminCont.style.display = 'none';
                mostrarModalAcceso(
                    "Acceso No Autorizado",
                    "Se requieren privilegios de Administrador para gestionar el catálogo de servicios (CU-14 / RN-34 / RN-35).",
                    function() {
                        window.location.replace('dashboard.html');
                    }
                );
            }
        });
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nuevo Servicio al Catálogo</h2>
            <form novalidate onsubmit="guardarCatalogo(event)">
                <div class="form-group">
                    <label>Nombre del Servicio:</label>
                    <input type="text" id="nom_serv" required pattern=".*\S+.*" title="El nombre del servicio no puede estar vacío ni compuesto solo por espacios." placeholder="Ej. Mantenimiento de áreas verdes">
                </div>
                <div class="form-group">
                    <label>Descripción (Opcional):</label>
                    <input type="text" id="desc_serv" placeholder="Ej. Poda, riego y fertilización general (Opcional)">
                </div>
                <div class="form-group">
                    <label>Costo Estándar ($):</label>
                    <input type="number" id="costo_est" step="0.01" min="0" placeholder="Ej. 150.00">
                </div>
                <button type="submit">Guardar en Catálogo</button>
            </form>
        </div>
    </div>

    <!-- Modal Corporativo -->
    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;
        let modalAccesoCallback = null;

        function mostrarModalAcceso(titulo, mensaje, onCerrar) {
            const modal = document.getElementById('modalMensaje');
            if (modal) {
                document.getElementById('tituloModal').innerText = titulo;
                document.getElementById('textoModal').innerText = mensaje;
                modalAccesoCallback = onCerrar || null;
                modal.style.display = 'flex';
            }
        }

        // Detección de inyecciones SQL y etiquetas HTML (V-01 / V-07)
        function contieneSqlOHtml(valor) {
            if (!valor || typeof valor !== 'string') return false;
            const regexSql = /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|TRUNCATE|EXEC(UTE)?|UNION|MERGE|GRANT|REVOKE)\b|--|\/\*|\*\/|;|\bOR\b\s+['"\d\w]+=\s*['"\d\w]+|\bAND\b\s+['"\d\w]+=\s*['"\d\w]+)/i;
            const regexHtml = /(<[^>]*>|<\s*script\b|javascript:|on\w+\s*=|style\s*=|iframe|object|embed|[<>])/i;
            return regexSql.test(valor) || regexHtml.test(valor);
        }

        function esNombreValido(str) {
            if (!str || typeof str !== 'string') return false;
            const limpio = str.trim();
            if (limpio.length < 2) return false;
            const letras = limpio.match(/[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/g);
            return (letras ? letras.length : 0) >= 2;
        }

        function guardarCatalogo(event) {
            event.preventDefault();

            const nomServRaw = document.getElementById('nom_serv').value;
            const nom_serv = (nomServRaw || '').trim();
            const descServRaw = document.getElementById('desc_serv').value;
            const desc_serv = (descServRaw || '').trim();
            const costoEstRaw = document.getElementById('costo_est').value;

            // Validación de campo obligatorio con trim() (CU-38 / RN-12: NOM_SERV NOT NULL / E15)
            if (!nom_serv || !esNombreValido(nom_serv)) {
                document.getElementById('tituloModal').innerText = "Aviso";
                document.getElementById('textoModal').innerText = "El nombre del servicio es obligatorio, debe tener al menos 2 caracteres y contener un mínimo de 2 letras (RN-12 / E15).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            // Validación contra inyección SQL y etiquetas HTML (V-01 / V-07)
            if (contieneSqlOHtml(nom_serv)) {
                document.getElementById('tituloModal').innerText = "Validación de Seguridad";
                document.getElementById('textoModal').innerText = "El nombre del servicio contiene caracteres o instrucciones no permitidas (V-01 / V-07).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            if (desc_serv && contieneSqlOHtml(desc_serv)) {
                document.getElementById('tituloModal').innerText = "Validación de Seguridad";
                document.getElementById('textoModal').innerText = "La descripción contiene instrucciones SQL o etiquetas HTML no permitidas (V-01 / V-07).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            let costo_est = 0;
            if (costoEstRaw !== '' && costoEstRaw !== null && costoEstRaw !== undefined) {
                const parsedCosto = parseFloat(costoEstRaw);
                if (isNaN(parsedCosto) || parsedCosto < 0) {
                    document.getElementById('tituloModal').innerText = "Validación";
                    document.getElementById('textoModal').innerText = "El costo estándar debe ser un número mayor o igual a 0 y no puede ser negativo (RN-33).";
                    document.getElementById('modalMensaje').style.display = 'flex';
                    return;
                }
                costo_est = Math.round((parsedCosto + Number.EPSILON) * 100) / 100;
            }

            const usuarioActual = localStorage.getItem('usuarioLogueado') || '';
            const rolActual = localStorage.getItem('rolUsuario') || '';
            const esAdmin = rolActual && (rolActual.toLowerCase() === 'admin' || rolActual.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.getElementById('tituloModal').innerText = "Acceso Denegado";
                document.getElementById('textoModal').innerText = "Acceso no autorizado. Se requieren privilegios de Administrador para registrar servicios en el catálogo (CU-14 / RN-34 / RN-35).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            const datos = {
                nom_serv,
                desc_serv: desc_serv || '',
                costo_est,
                rolUsuario: rolActual,
                usuarioLogueado: usuarioActual
            };

            fetch('/api/catalogo-servicios', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-rol-usuario': rolActual,
                    'x-usuario': usuarioActual
                },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                let data;
                try {
                    data = await res.json();
                } catch (e) {
                    data = { exito: false, error: 'Respuesta inválida del servidor.' };
                }

                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Error de Validación";
                    document.getElementById('textoModal').innerText = data.error || "No se pudo registrar el servicio.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error";
                document.getElementById('textoModal').innerText = "Error de comunicación con el servidor.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if (modalAccesoCallback) {
                const cb = modalAccesoCallback;
                modalAccesoCallback = null;
                cb();
                return;
            }
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
