<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Plantas - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD Y CONTROL DE ACCESO (CU-6 / CU-18 / RN-34 / RN-35) -->
    <script>
        function verificarSesion() {
            if (!localStorage.getItem('usuarioLogueado')) {
                window.location.replace('/'); 
                return;
            }
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.documentElement.classList.add('rol-empleado');
            }
        }
        verificarSesion();
        window.addEventListener('pageshow', function(event) {
            verificarSesion();
        });
        document.addEventListener('DOMContentLoaded', function() {
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.querySelectorAll('nav a[href="registro-empleado.html"], nav a[href="registro-usuario.html"], nav a[href="registro-catalogo-servicio.html"]').forEach(el => el.style.display = 'none');
            }
        });
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nueva Planta</h2>
            <form novalidate onsubmit="guardarPlanta(event)">
                <div class="form-group">
                    <label>Tipo de Planta (Opcional):</label>
                    <input type="text" id="tipo" placeholder="Ej. Suculenta">
                </div>
                <div class="form-group">
                    <label>Nombre Científico:</label>
                    <input type="text" id="cientifico" required placeholder="Ej. Echeveria elegans">
                </div>
                <div class="form-group">
                    <label>Nombre Común:</label>
                    <input type="text" id="comun" required placeholder="Ej. Rosa de alabastro">
                </div>
                <div class="form-group">
                    <label>Tamaño (cm) (Opcional):</label>
                    <input type="number" id="tamano" step="0.01" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Stock Inicial:</label>
                    <input type="number" id="stock" min="0" step="1" placeholder="Ej. 10">
                </div>
                <div class="form-group">
                    <label>Precio Unitario ($):</label>
                    <input type="number" id="precio" step="0.01" min="0" placeholder="Ej. 50.00">
                </div>
                <div class="form-group">
                    <label>Proveedor:</label>
                    <select id="proveedor" required>
                        <option value="">Cargando proveedores...</option>
                    </select>
                </div>
                <button type="submit">Guardar Planta</button>
            </form>
        </div>
    </div>

    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;

        window.onload = function() {
            fetch('/api/proveedores')
                .then(res => res.json())
                .then(data => {
                    const sel = document.getElementById('proveedor');
                    sel.innerHTML = '<option value="">Seleccione un proveedor</option>';
                    data.forEach(p => sel.innerHTML += `<option value="${p.ID_PROV}">${p.NOM_PROV}</option>`);
                });
        };

        function contieneSqlOHtml(valor) {
            if (!valor || typeof valor !== 'string') return false;
            const regexSql = /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|TRUNCATE|EXEC(UTE)?|UNION|MERGE|GRANT|REVOKE)\b|--|\/\*|\*\/|;|\bOR\b\s+['"\d\w]+=\s*['"\d\w]+|\bAND\b\s+['"\d\w]+=\s*['"\d\w]+)/i;
            const regexHtml = /(<[^>]*>|<\s*script\b|javascript:|on\w+\s*=)/i;
            return regexSql.test(valor) || regexHtml.test(valor);
        }

        function esNombreValido(str) {
            if (!str || typeof str !== 'string') return false;
            const limpio = str.trim();
            if (limpio.length < 2) return false;
            const letras = limpio.match(/[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/g);
            return (letras ? letras.length : 0) >= 2;
        }

        function guardarPlanta(event) {
            event.preventDefault();
            const cientifico = document.getElementById('cientifico').value.trim();
            const comun = document.getElementById('comun').value.trim();
            const proveedor = document.getElementById('proveedor').value;

            // Validación: Nombre científico, nombre común y proveedor obligatorios (CU-23 / RN-12 / E15)
            if (!cientifico || !esNombreValido(cientifico)) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El nombre científico de la planta es obligatorio, debe tener al menos 2 caracteres y contener un mínimo de 2 letras (E15).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            // Detección y rechazo de SQL / HTML (CU-25 / V-01 / V-07)
            if (contieneSqlOHtml(cientifico)) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El nombre científico contiene instrucciones SQL o etiquetas HTML no permitidas.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            if (!comun || !esNombreValido(comun)) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El nombre común de la planta es obligatorio, debe tener al menos 2 caracteres y contener un mínimo de 2 letras (E15).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            if (contieneSqlOHtml(comun)) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El nombre común contiene instrucciones SQL o etiquetas HTML no permitidas.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            if (!proveedor) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "Debe seleccionar un proveedor válido.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            const stockVal = document.getElementById('stock').value;
            const precioVal = document.getElementById('precio').value;
            const tamanoVal = document.getElementById('tamano').value;

            let stockFinal = 0;
            if (stockVal !== '' && stockVal !== null && stockVal !== undefined) {
                const stockNum = Number(stockVal);
                if (isNaN(stockNum) || !Number.isInteger(stockNum) || stockNum < 0) {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Validación";
                    document.getElementById('textoModal').innerText = "El stock de la planta debe ser un número entero mayor o igual a 0 (RN-17).";
                    document.getElementById('modalMensaje').style.display = 'flex';
                    return;
                }
                stockFinal = stockNum;
            }

            let precioFinal = 0;
            if (precioVal !== '' && precioVal !== null && precioVal !== undefined) {
                const precioNum = parseFloat(precioVal);
                if (isNaN(precioNum) || precioNum < 0) {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Validación";
                    document.getElementById('textoModal').innerText = "El precio de la planta debe ser mayor o igual a 0 y no puede ser negativo (RN-16).";
                    document.getElementById('modalMensaje').style.display = 'flex';
                    return;
                }
                precioFinal = Math.round((precioNum + Number.EPSILON) * 100) / 100;
            }

            const tamanoFinal = tamanoVal !== '' ? parseFloat(tamanoVal) : null;
            const tipoFinal = document.getElementById('tipo').value.trim();

            const datos = {
                tipo: tipoFinal || '',
                cientifico: cientifico,
                comun: comun,
                tamano: tamanoFinal,
                stock: stockFinal,
                precio: precioFinal,
                proveedor: proveedor
            };

            fetch('/api/plantas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso del Sistema";
                    document.getElementById('textoModal').innerText = data.error || "Esta planta ya se encuentra registrada.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error de Servidor";
                document.getElementById('textoModal').innerText = "Error de comunicación con la base de datos.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
