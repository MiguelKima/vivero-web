<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Plantas - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD -->
    <script>
        if (!localStorage.getItem('usuarioLogueado')) {
            window.location.replace('/'); 
        }
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nueva Planta</h2>
            <form onsubmit="guardarPlanta(event)">
                <div class="form-group">
                    <label>Tipo de Planta:</label>
                    <input type="text" id="tipo" required placeholder="Ej. Suculenta">
                </div>
                <div class="form-group">
                    <label>Nombre Científico:</label>
                    <input type="text" id="cientifico" required placeholder="Ej. Echeveria elegans">
                </div>
                <div class="form-group">
                    <label>Nombre Común:</label>
                    <input type="text" id="comun" placeholder="Ej. Rosa de alabastro">
                </div>
                <div class="form-group">
                    <label>Tamaño (cm):</label>
                    <input type="number" id="tamano" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Stock Inicial:</label>
                    <input type="number" id="stock" required placeholder="0">
                </div>
                <div class="form-group">
                    <label>Precio Unitario ($):</label>
                    <input type="number" id="precio" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Proveedor:</label>
                    <select id="proveedor" required>
                        <option value="">Cargando proveedores...</option>
                    </select>
                </div>
                <button type="submit">Guardar Planta</button>
            </form>
        </div>
    </div>

    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;

        window.onload = function() {
            fetch('/api/proveedores')
                .then(res => res.json())
                .then(data => {
                    const sel = document.getElementById('proveedor');
                    sel.innerHTML = '<option value="">Seleccione un proveedor</option>';
                    data.forEach(p => sel.innerHTML += `<option value="${p.ID_PROV}">${p.NOM_PROV}</option>`);
                });
        };

        function guardarPlanta(event) {
            event.preventDefault();
            const datos = {
                tipo: document.getElementById('tipo').value,
                cientifico: document.getElementById('cientifico').value,
                comun: document.getElementById('comun').value,
                tamano: document.getElementById('tamano').value,
                stock: document.getElementById('stock').value,
                precio: document.getElementById('precio').value,
                proveedor: document.getElementById('proveedor').value
            };

            fetch('/api/plantas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso de Duplicidad";
                    document.getElementById('textoModal').innerText = data.error || "Esta planta ya se encuentra registrada.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error de Servidor";
                document.getElementById('textoModal').innerText = "Error de comunicación con la base de datos.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
