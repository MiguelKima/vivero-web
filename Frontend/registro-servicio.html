<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Servicios - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD Y CONTROL DE ACCESO (CU-6 / CU-18 / RN-34 / RN-35) -->
    <script>
        function verificarSesion() {
            if (!localStorage.getItem('usuarioLogueado')) {
                window.location.replace('/'); 
                return;
            }
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.documentElement.classList.add('rol-empleado');
            }
        }
        verificarSesion();
        window.addEventListener('pageshow', function(event) {
            verificarSesion();
        });
        document.addEventListener('DOMContentLoaded', function() {
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.querySelectorAll('nav a[href="registro-empleado.html"], nav a[href="registro-usuario.html"], nav a[href="registro-catalogo-servicio.html"]').forEach(el => el.style.display = 'none');
            }
        });
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Servicio Profesional</h2>
            <form onsubmit="guardarServicio(event)">
                <div class="form-group">
                    <label>Cliente:</label>
                    <select id="id_cli" required>
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Recomendación / Seleccionar del Catálogo de Servicios:</label>
                    <select id="catalogo_serv" onchange="seleccionarServicioCatalogo()">
                        <option value="">-- Seleccione un servicio del catálogo (Opcional) --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Trabajo Realizado / Descripción:</label>
                    <input type="text" id="trabajo" required maxlength="200" placeholder="Ej. Mantenimiento de áreas verdes">
                </div>

                <div class="form-group">
                    <label>Fecha de Realización / Ejecución:</label>
                    <input type="date" id="fecha_ejec" required>
                </div>

                <div class="form-group">
                    <label>Costo del Servicio ($):</label>
                    <input type="number" id="costo" step="0.01" min="0" value="0" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label>Empleado Responsable (Opcional):</label>
                    <select id="id_emp">
                        <option value="">-- Seleccione un empleado (Opcional) --</option>
                    </select>
                </div>

                <button type="submit">Registrar Servicio</button>
            </form>
        </div>
    </div>

    <!-- Modal Corporativo -->
    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;
        let listaCatalogo = [];

        // Detección de inyecciones SQL y etiquetas HTML peligrosas (CU-36 / V-01 / V-07)
        function contieneSqlOHtml(valor) {
            if (!valor || typeof valor !== 'string') return false;
            const regexSql = /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|TRUNCATE|EXEC(UTE)?|UNION|MERGE|GRANT|REVOKE)\b|--|\/\*|\*\/|;|\bOR\b\s+['"\d\w]+=\s*['"\d\w]+|\bAND\b\s+['"\d\w]+=\s*['"\d\w]+)/i;
            const regexHtml = /(<[^>]*>|<\s*script\b|javascript:|on\w+\s*=|style\s*=|iframe|object|embed|[<>])/i;
            return regexSql.test(valor) || regexHtml.test(valor);
        }

        window.onload = function() {
            // Asignar fecha actual por defecto al campo de fecha
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fecha_ejec').value = hoy;

            // Cargar clientes
            fetch('/api/clientes')
                .then(res => res.json())
                .then(data => {
                    const sel = document.getElementById('id_cli');
                    sel.innerHTML = '<option value="">Seleccione un cliente</option>';
                    if(data && data.length > 0) {
                        data.forEach(c => {
                            sel.innerHTML += `<option value="${c.ID_CLI}">${c.NOM_CLI} (${c.ID_CLI})</option>`;
                        });
                    } else {
                        sel.innerHTML = '<option value="">No hay clientes registrados</option>';
                    }
                })
                .catch(err => console.error("Error cargando clientes:", err));

            // Cargar Catálogo de Servicios para las recomendaciones
            fetch('/api/catalogo-servicios')
                .then(res => res.json())
                .then(data => {
                    listaCatalogo = data;
                    const sel = document.getElementById('catalogo_serv');
                    if(data && data.length > 0) {
                        data.forEach(s => {
                            sel.innerHTML += `<option value="${s.ID_CAT_SERV}">${s.NOM_SERV} - $${s.COSTO_EST.toFixed(2)}</option>`;
                        });
                    }
                })
                .catch(err => console.error("Error cargando catálogo:", err));

            // Cargar empleados
            fetch('/api/empleados')
                .then(res => res.json())
                .then(data => {
                    const sel = document.getElementById('id_emp');
                    sel.innerHTML = '<option value="">-- Seleccione un empleado (Opcional) --</option>';
                    if(data && data.length > 0) {
                        data.forEach(e => {
                            sel.innerHTML += `<option value="${e.ID_EMP}">${e.NOM_EMP} (${e.PUE_EMP || 'Empleado'})</option>`;
                        });
                    } else {
                        sel.innerHTML = '<option value="">Sin empleados registrados</option>';
                    }
                })
                .catch(err => console.error("Error cargando empleados:", err));
        };

        function seleccionarServicioCatalogo() {
            const idCat = document.getElementById('catalogo_serv').value;
            if(!idCat) return;

            const servEncontrado = listaCatalogo.find(s => s.ID_CAT_SERV === idCat);
            if(servEncontrado) {
                document.getElementById('trabajo').value = servEncontrado.NOM_SERV;
                document.getElementById('costo').value = servEncontrado.COSTO_EST.toFixed(2);
            }
        }

        function guardarServicio(event) {
            event.preventDefault();
            
            const id_cli = document.getElementById('id_cli').value;
            const trabajo = document.getElementById('trabajo').value.trim();
            const fecha_ejec = document.getElementById('fecha_ejec').value;
            const costoRaw = document.getElementById('costo').value;
            let costo = 0;
            if (costoRaw !== '' && costoRaw !== null && costoRaw !== undefined) {
                const parsedCosto = parseFloat(String(costoRaw).replace(/[^0-9.-]/g, ''));
                if (isNaN(parsedCosto) || parsedCosto < 0) {
                    document.getElementById('tituloModal').innerText = "Aviso";
                    document.getElementById('textoModal').innerText = "El costo del servicio debe ser un número mayor o igual a 0 (el cero es válido, RN-16 / RN-33).";
                    document.getElementById('modalMensaje').style.display = 'flex';
                    return;
                }
                costo = parsedCosto;
            }
            const id_emp = document.getElementById('id_emp').value;

            if (!trabajo) {
                document.getElementById('tituloModal').innerText = "Aviso";
                document.getElementById('textoModal').innerText = "La descripción del trabajo es obligatoria.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            // Validación de inyección SQL y etiquetas HTML (CU-36 / V-01 / V-07)
            if (contieneSqlOHtml(trabajo)) {
                document.getElementById('tituloModal').innerText = "Validación de Seguridad";
                document.getElementById('textoModal').innerText = "El trabajo realizado contiene instrucciones SQL o etiquetas HTML no permitidas (V-01 / V-07).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            if (trabajo.length > 200) {
                document.getElementById('tituloModal').innerText = "Aviso";
                document.getElementById('textoModal').innerText = "El trabajo realizado no puede exceder los 200 caracteres (RN-19).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            const usuarioActual = localStorage.getItem('usuarioLogueado') || '';
            const rolActual = localStorage.getItem('rolUsuario') || '';

            const datos = {
                id_cli,
                trabajo,
                fecha_ejec,
                costo,
                id_emp,
                usuarioLogueado: usuarioActual,
                rolUsuario: rolActual
            };

            fetch('/api/servicios', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-rol-usuario': rolActual,
                    'x-usuario': usuarioActual
                },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                let data;
                try {
                    data = await res.json();
                } catch (e) {
                    data = { exito: false, error: 'Respuesta inválida del servidor.' };
                }

                if (res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Error de Validación";
                    document.getElementById('textoModal').innerText = data.error || "No se pudo registrar el servicio.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error";
                document.getElementById('textoModal').innerText = "Error de comunicación con el servidor.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
