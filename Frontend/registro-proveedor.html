<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Proveedores - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD -->
    <script>
        if (!localStorage.getItem('usuarioLogueado')) {
            window.location.replace('/'); 
        }
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nuevo Proveedor</h2>
            <form onsubmit="guardarProveedor(event)">
                <div class="form-group">
                    <label>Tipo de Suministro:</label>
                    <input type="text" id="tip_sum" required placeholder="Ej. Fertilizantes, Herramientas...">
                </div>
                <div class="form-group">
                    <label>Nombre del Proveedor / Empresa:</label>
                    <input type="text" id="nom_prov" required>
                </div>
                <div class="form-group">
                    <label>RFC:</label>
                    <input type="text" id="rfc_prov" required>
                </div>
                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" id="dir_prov" required>
                </div>
                <div class="form-group">
                    <label>Contacto (Teléfono/Email):</label>
                    <input type="text" id="con_prov" required>
                </div>
                <div class="form-group">
                    <label>Producto Principal que Provee:</label>
                    <input type="text" id="pro_prov" required>
                </div>
                <button type="submit">Registrar Proveedor</button>
            </form>
        </div>
    </div>

    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;

        function guardarProveedor(event) {
            event.preventDefault();
            const datos = {
                tip_sum: document.getElementById('tip_sum').value,
                nom_prov: document.getElementById('nom_prov').value,
                rfc_prov: document.getElementById('rfc_prov').value,
                dir_prov: document.getElementById('dir_prov').value,
                con_prov: document.getElementById('con_prov').value,
                pro_prov: document.getElementById('pro_prov').value
            };

            fetch('/api/proveedores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            }).then(async res => {
                const data = await res.json();
                if(data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso";
                    document.getElementById('textoModal').innerText = data.error;
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            }).catch(err => alert("Error de comunicación."));
        }

        function cerrarModal() { 
            document.getElementById('modalMensaje').style.display = 'none'; 
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
