<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Vivero</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <!-- Formulario de Alta -->
        <div class="card" style="max-width: 600px; margin: auto; margin-bottom: 30px;">
            <h2>Alta de Nuevo Usuario del Sistema</h2>
            <form onsubmit="guardarUsuario(event)">
                <div class="form-group">
                    <label>Nombre de Usuario:</label>
                    <input type="text" id="username" required placeholder="Ej. jperez">
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <div class="form-group">
                    <label>Rol del Sistema:</label>
                    <select id="rol" required>
                        <option value="">Seleccione un rol</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Empleado">Empleado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Empleado Asociado:</label>
                    <select id="id_emp" required>
                        <option value="">Seleccione un empleado</option>
                    </select>
                </div>
                <button type="submit">Registrar Usuario</button>
            </form>
        </div>

        <!-- Tabla de Gestión de Usuarios (Activar / Inhabilitar) -->
        <div class="card">
            <h2>Control de Accesos (Usuarios Registrados)</h2>
            <div id="contenedor-usuarios" style="margin-top: 20px;">
                <p>Cargando lista de usuarios...</p>
            </div>
        </div>
    </div>

    <!-- Modal Corporativo -->
    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;

        window.onload = function() {
            const rol = localStorage.getItem('rolUsuario');
            if (!rol || (rol.toLowerCase() !== 'admin' && rol.toLowerCase() !== 'administrador')) {
                alert('Acceso no autorizado. Se requieren privilegios de Administrador.');
                window.location.href = 'dashboard.html';
            }

            cargarEmpleados();
            cargarUsuariosSistema();
        };

        function cargarEmpleados() {
            fetch('/api/empleados')
                .then(res => res.json())
                .then(data => {
                    const sel = document.getElementById('id_emp');
                    sel.innerHTML = '<option value="">Seleccione un empleado</option>';
                    if(data && data.length > 0) {
                        data.forEach(e => {
                            sel.innerHTML += `<option value="${e.ID_EMP}">${e.NOM_EMP} (${e.PUE_EMP})</option>`;
                        });
                    }
                })
                .catch(err => console.error("Error cargando empleados:", err));
        }

        function cargarUsuariosSistema() {
            fetch('/api/usuarios')
                .then(res => res.json())
                .then(usuarios => {
                    const contenedor = document.getElementById('contenedor-usuarios');
                    if(usuarios.length === 0) {
                        contenedor.innerHTML = '<p>No hay usuarios registrados.</p>';
                        return;
                    }

                    let tabla = `
                        <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                            <thead>
                                <tr style="background-color: #f1f3f5; text-align: left; border-bottom: 2px solid #dee2e6;">
                                    <th style="padding: 10px;">ID</th>
                                    <th style="padding: 10px;">Usuario</th>
                                    <th style="padding: 10px;">Rol</th>
                                    <th style="padding: 10px;">Empleado Asoc.</th>
                                    <th style="padding: 10px;">Estado</th>
                                    <th style="padding: 10px; text-align: center;">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    usuarios.forEach(u => {
                        const esInactivo = u.ESTADO && u.ESTADO.toLowerCase() === 'inactivo';
                        const colorEstado = esInactivo ? 'color: red; font-weight: bold;' : 'color: green; font-weight: bold;';
                        const textoBoton = esInactivo ? 'Activar' : 'Deshabilitar';
                        const colorBoton = esInactivo ? '#2b9348' : '#d90429';
                        const nuevoEstado = esInactivo ? 'Activo' : 'Inactivo';

                        tabla += `
                            <tr style="border-bottom: 1px solid #dee2e6;">
                                <td style="padding: 10px;">${u.ID_USUARIO}</td>
                                <td style="padding: 10px;">${u.USERNAME}</td>
                                <td style="padding: 10px;">${u.ROL}</td>
                                <td style="padding: 10px;">${u.ID_EMP || 'N/A'}</td>
                                <td style="padding: 10px; ${colorEstado}">${u.ESTADO || 'Activo'}</td>
                                <td style="padding: 10px; text-align: center;">
                                    <button onclick="cambiarEstado('${u.ID_USUARIO}', '${nuevoEstado}')" style="background-color: ${colorBoton}; padding: 6px 12px; font-size: 13px;">
                                        ${textoBoton}
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    tabla += `</tbody></table>`;
                    contenedor.innerHTML = tabla;
                })
                .catch(err => {
                    document.getElementById('contenedor-usuarios').innerHTML = '<p style="color: red;">Error al obtener la lista de usuarios.</p>';
                });
        }

        function cambiarEstado(idUsuario, nuevoEstado) {
            fetch(`/api/usuarios/${idUsuario}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: nuevoEstado })
            })
            .then(res => res.json())
            .then(data => {
                if(data.exito) {
                    cargarUsuariosSistema();
                } else {
                    alert(data.error || "No se pudo actualizar el estado.");
                }
            })
            .catch(err => alert("Error de comunicación con el servidor."));
        }

        function guardarUsuario(event) {
            event.preventDefault();
            const datos = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                rol: document.getElementById('rol').value,
                id_emp: document.getElementById('id_emp').value
            };

            fetch('/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso";
                    document.getElementById('textoModal').innerText = data.error || "No se pudo registrar el usuario.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error de Servidor";
                document.getElementById('textoModal').innerText = "Error de comunicación con la base de datos.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if(esExito) {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
