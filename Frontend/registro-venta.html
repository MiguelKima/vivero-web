<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Ventas - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD -->
    <script>
        if (!localStorage.getItem('usuarioLogueado')) {
            window.location.replace('/'); 
        }
    </script>

    <style>
        .ticket-box {
            background: #fff;
            padding: 20px;
            border: 1px dashed #333;
            font-family: 'Courier New', Courier, monospace;
            width: 320px;
            margin: auto;
            text-align: left;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #contenidoModal, #contenidoModal * {
                visibility: visible;
            }
            #contenidoModal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .custom-modal {
                background: none !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <!-- Formulario de Venta -->
        <div class="card" style="max-width: 600px; margin: auto; margin-bottom: 30px;">
            <h2>Punto de Venta / Caja</h2>
            <form id="formVenta" onsubmit="realizarVenta(event)">
                <div class="form-group">
                    <label>Cliente:</label>
                    <select id="id_cliente" required>
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Producto del Inventario (Opcional):</label>
                    <select id="id_producto" onchange="calcularTotal()">
                        <option value="">Ninguno / Seleccione producto</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Cantidad de Producto:</label>
                    <input type="number" id="cant_producto" min="0" value="0" oninput="calcularTotal()">
                </div>

                <div class="form-group">
                    <label>Planta del Vivero (Opcional):</label>
                    <select id="id_planta" onchange="calcularTotal()">
                        <option value="">Ninguna / Seleccione planta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Cantidad de Plantas:</label>
                    <input type="number" id="cant_planta" min="0" value="0" oninput="calcularTotal()">
                </div>

                <div class="form-group">
                    <label>Forma de Pago:</label>
                    <select id="forma_pago" required>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Tarjeta">Tarjeta de Crédito / Débito</option>
                        <option value="Transferencia">Transferencia</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Total a Pagar ($):</label>
                    <input type="number" id="total" step="0.01" readonly style="background-color: #e9ecef; font-weight: bold;" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label>Saldo Pendiente / Cambio ($):</label>
                    <input type="number" id="saldo" step="0.01" value="0" required>
                </div>

                <button type="submit">Procesar Venta</button>
            </form>
        </div>

        <!-- Historial de Ventas -->
        <div class="card">
            <h2>Historial de Ventas Realizadas</h2>
            <div id="contenedor-historial" style="margin-top: 20px;">
                <p>Cargando historial...</p>
            </div>
        </div>
    </div>

    <!-- Modal de Ticket con Opción de Impresión -->
    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content" style="max-width: 450px; text-align: center;">
            <h3 id="tituloModal">Ticket de Venta</h3>
            <div id="contenidoModal" style="margin: 15px 0;"></div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="window.print()" style="background-color: var(--secondary-color); padding: 10px 20px;">Imprimir Ticket</button>
                <button onclick="cerrarModal()" style="background-color: #6c757d; padding: 10px 20px;">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        let listaProductos = [];
        let listaPlantas = [];
        let ventasGlobales = [];

        window.onload = function() {
            fetch('/api/clientes')
                .then(res => res.json())
                .then(data => {
                    const sel = document.getElementById('id_cliente');
                    sel.innerHTML = '<option value="">Seleccione un cliente</option>';
                    data.forEach(c => sel.innerHTML += `<option value="${c.ID_CLI}">${c.NOM_CLI} (${c.ID_CLI})</option>`);
                });

            fetch('/api/productos')
                .then(res => res.json())
                .then(data => {
                    listaProductos = data;
                    const sel = document.getElementById('id_producto');
                    sel.innerHTML = '<option value="">Ninguno / Seleccione producto</option>';
                    data.forEach(p => {
                        const precio = parseFloat(p.PREC_PRO) || 0;
                        sel.innerHTML += `<option value="${p.ID_PRO}">${p.DESC_PRO} ($${precio.toFixed(2)})</option>`;
                    });
                });

            fetch('/api/plantas')
                .then(res => res.json())
                .then(data => {
                    listaPlantas = data;
                    const sel = document.getElementById('id_planta');
                    sel.innerHTML = '<option value="">Ninguna / Seleccione planta</option>';
                    data.forEach(pl => {
                        const precio = parseFloat(pl.PREC_PLANTA) || 0;
                        sel.innerHTML += `<option value="${pl.ID_PLANTA}">${pl.NOM_COM || pl.NOM_CTFO} ($${precio.toFixed(2)})</option>`;
                    });
                });

            cargarHistorialVentas();
        };

        function calcularTotal() {
            const idProd = document.getElementById('id_producto').value;
            const cantProd = parseInt(document.getElementById('cant_producto').value) || 0;
            const idPlanta = document.getElementById('id_planta').value;
            const cantPlanta = parseInt(document.getElementById('cant_planta').value) || 0;

            let precioProd = 0;
            let precioPlanta = 0;

            if (idProd) {
                const p = listaProductos.find(x => x.ID_PRO === idProd);
                if (p) precioProd = parseFloat(p.PREC_PRO) || 0;
            }

            if (idPlanta) {
                const pl = listaPlantas.find(x => x.ID_PLANTA === idPlanta);
                if (pl) precioPlanta = parseFloat(pl.PREC_PLANTA) || 0;
            }

            const total = (precioProd * cantProd) + (precioPlanta * cantPlanta);
            document.getElementById('total').value = total.toFixed(2);
        }

        // Agregamos 'return' para que la función avise cuando termina de descargar los datos
        function cargarHistorialVentas() {
            return fetch('/api/ventas')
                .then(res => res.json())
                .then(ventas => {
                    ventasGlobales = ventas;
                    const contenedor = document.getElementById('contenedor-historial');
                    if(ventas.length === 0) {
                        contenedor.innerHTML = '<p>No hay ventas registradas.</p>';
                        return;
                    }

                    let tabla = `
                        <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                            <thead>
                                <tr style="background-color: #f1f3f5; text-align: left; border-bottom: 2px solid #dee2e6;">
                                    <th style="padding: 10px;">ID Venta</th>
                                    <th style="padding: 10px;">Cliente</th>
                                    <th style="padding: 10px;">Fecha</th>
                                    <th style="padding: 10px;">Pago</th>
                                    <th style="padding: 10px;">Total</th>
                                    <th style="padding: 10px; text-align: center;">Ticket</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    ventas.forEach(v => {
                        const fechaFormateada = new Date(v.FECHA_COMP).toLocaleString();
                        tabla += `
                            <tr style="border-bottom: 1px solid #dee2e6;">
                                <td style="padding: 10px;">${v.ID_VEN}</td>
                                <td style="padding: 10px;">${v.NOM_CLI}</td>
                                <td style="padding: 10px;">${fechaFormateada}</td>
                                <td style="padding: 10px;">${v.FORM_PAGO}</td>
                                <td style="padding: 10px; font-weight: bold;">$${parseFloat(v.TOT_PAGO).toFixed(2)}</td>
                                <td style="padding: 10px; text-align: center;">
                                    <button type="button" onclick="verTicket('${v.ID_VEN}')" style="background-color: var(--secondary-color); padding: 6px 12px; font-size: 13px;">Ver Ticket</button>
                                </td>
                            </tr>
                        `;
                    });

                    tabla += `</tbody></table>`;
                    contenedor.innerHTML = tabla;
                })
                .catch(err => {
                    document.getElementById('contenedor-historial').innerHTML = '<p style="color: red;">Error al obtener el historial.</p>';
                });
        }

        function verTicket(idVenta) {
            const v = ventasGlobales.find(x => x.ID_VEN === idVenta);
            if (!v) return;

            const cajeroActual = localStorage.getItem('usuarioLogueado') || 'Administrador';
            const fechaFormateada = new Date(v.FECHA_COMP).toLocaleString();

            const contenido = `
                <div class="ticket-box">
                    <center><strong>VIVERO LA PLAZA</strong><br>
                    Sistema de Administración<br>
                    ----------------------------------</center>
                    <strong>Ticket:</strong> ${v.ID_VEN}<br>
                    <strong>Fecha:</strong> ${fechaFormateada}<br>
                    <strong>Cliente:</strong> ${v.NOM_CLI}<br>
                    <strong>Cajero:</strong> ${cajeroActual}<br>
                    ----------------------------------<br>
                    <strong>Artículo(s):</strong><br>
                    - Prod: ${v.DESC_PRO}<br>
                    - Planta: ${v.NOM_PLANTA}<br>
                    ----------------------------------<br>
                    <strong>Forma Pago:</strong> ${v.FORM_PAGO}<br>
                    <strong>Total Pagado:</strong> $${parseFloat(v.TOT_PAGO).toFixed(2)}<br>
                    <strong>Saldo / Cambio:</strong> $${parseFloat(v.SALDO_PAGO).toFixed(2)}<br>
                    <center>----------------------------------<br>
                    ¡GRACIAS POR SU COMPRA!</center>
                </div>
            `;

            document.getElementById('tituloModal').innerText = `Ticket de Venta (${v.ID_VEN})`;
            document.getElementById('contenidoModal').innerHTML = contenido;
            document.getElementById('modalMensaje').style.display = 'flex';
        }

        function realizarVenta(event) {
            event.preventDefault();
            
            const id_cliente = document.getElementById('id_cliente').value;
            const id_producto = document.getElementById('id_producto').value;
            const cant_producto = parseInt(document.getElementById('cant_producto').value) || 0;
            const id_planta = document.getElementById('id_planta').value;
            const cant_planta = parseInt(document.getElementById('cant_planta').value) || 0;
            const forma_pago = document.getElementById('forma_pago').value;
            const total = parseFloat(document.getElementById('total').value) || 0;
            const saldo = parseFloat(document.getElementById('saldo').value) || 0;
            const cajero = localStorage.getItem('usuarioLogueado') || 'Administrador';

            if (!id_producto && !id_planta) {
                alert("Debe seleccionar al menos un producto o una planta.");
                return;
            }

            const datos = { id_cliente, id_producto, cant_producto, id_planta, cant_planta, forma_pago, total, saldo, cajero };

            fetch('/api/ventas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(res => res.json())
            .then(data => {
                if (data.exito) {
                    // Magia aquí: Usamos .then() para esperar a que termine de cargar el historial
                    // antes de intentar abrir el modal del ticket.
                    cargarHistorialVentas().then(() => {
                        verTicket(data.ticket.id_venta);
                        
                        // Limpiamos el formulario automáticamente después del éxito
                        document.getElementById('formVenta').reset();
                        document.getElementById('total').value = '';
                    });
                } else {
                    alert(data.error || "Error al procesar la venta.");
                }
            })
            .catch(err => alert("Error de comunicación con el servidor."));
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
        }
    </script>
</body>
</html>
