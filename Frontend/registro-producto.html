<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Productos - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD Y CONTROL DE ACCESO (CU-6 / CU-18 / RN-34 / RN-35) -->
    <script>
        function verificarSesion() {
            if (!localStorage.getItem('usuarioLogueado')) {
                window.location.replace('/'); 
                return;
            }
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.documentElement.classList.add('rol-empleado');
            }
        }
        verificarSesion();
        window.addEventListener('pageshow', function(event) {
            verificarSesion();
        });
        document.addEventListener('DOMContentLoaded', function() {
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.querySelectorAll('nav a[href="registro-empleado.html"], nav a[href="registro-usuario.html"], nav a[href="registro-catalogo-servicio.html"]').forEach(el => el.style.display = 'none');
            }
        });
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nuevo Producto</h2>
            <form onsubmit="guardarProducto(event)">
                <div class="form-group">
                    <label>Tipo de Producto (Opcional):</label>
                    <input type="text" id="tip_pro" placeholder="Ej. Abono / Herramienta">
                </div>
                <div class="form-group">
                    <label>Descripción del Producto:</label>
                    <input type="text" id="desc_pro" required placeholder="Ej. Tierra de hoja 5kg">
                </div>
                <div class="form-group">
                    <label>Stock en Inventario:</label>
                    <input type="number" id="stock_pro" required min="1" step="1" placeholder="Ej. 10">
                </div>
                <div class="form-group">
                    <label>Precio Unitario ($):</label>
                    <input type="number" id="prec_pro" required step="0.01" min="0.01" placeholder="Ej. 50.00">
                </div>
                <div class="form-group">
                    <label>Proveedor:</label>
                    <select id="id_prov" required>
                        <option value="">Cargando proveedores...</option>
                    </select>
                </div>
                <button type="submit">Guardar Producto</button>
            </form>
        </div>
    </div>

    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;

        window.onload = function() {
            fetch('/api/proveedores')
                .then(res => res.json())
                .then(data => {
                    const sel = document.getElementById('id_prov');
                    sel.innerHTML = '<option value="">Seleccione un proveedor</option>';
                    data.forEach(p => sel.innerHTML += `<option value="${p.ID_PROV}">${p.NOM_PROV}</option>`);
                });
        };

        function guardarProducto(event) {
            event.preventDefault();
            const desc_pro = document.getElementById('desc_pro').value.trim();
            const id_prov = document.getElementById('id_prov').value;

            // Validación con trim(): Solo descripción y proveedor son obligatorios (CU-19 / CU-20 / RN-31 / CU-08 FA-03)
            if (!desc_pro) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "La descripción del producto es obligatoria y no puede estar vacía ni contener solo espacios.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            if (!id_prov) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "Debe seleccionar un proveedor válido.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            const stockVal = document.getElementById('stock_pro').value;
            const precVal = document.getElementById('prec_pro').value;

            // Validación de precio mayor a 0 (no se permiten productos gratis a $0.00)
            if (precVal === '' || precVal === null || precVal === undefined) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El precio del producto es obligatorio y debe ser mayor a 0 ($0.00 no permitido porque no es gratis).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }
            const precioNum = parseFloat(precVal);
            if (isNaN(precioNum) || precioNum <= 0) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El precio del producto debe ser mayor a 0 ($0.00 no permitido porque no es gratis).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }
            const precioFinal = Math.round((precioNum + Number.EPSILON) * 100) / 100;

            // Validación de stock entero mayor a 0 (no se permite stock 0)
            if (stockVal === '' || stockVal === null || stockVal === undefined) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El stock del producto es obligatorio y debe ser un número entero mayor a 0.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }
            const stockNum = Number(stockVal);
            if (isNaN(stockNum) || !Number.isInteger(stockNum) || stockNum <= 0) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El stock del producto debe ser un número entero mayor a 0 (no se puede registrar un producto con existencias en 0).";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }
            const stockFinal = stockNum;

            // Stock y precio por defecto 0 si no se ingresan, tipo opcional
            const datos = {
                tip_pro: document.getElementById('tip_pro').value.trim() || '',
                desc_pro: desc_pro,
                stock_pro: stockFinal,
                prec_pro: precioFinal,
                id_prov: id_prov
            };

            fetch('/api/productos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso del Sistema";
                    document.getElementById('textoModal').innerText = data.error || "Este producto ya existe en el inventario.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error de Servidor";
                document.getElementById('textoModal').innerText = "Error de comunicación con la base de datos.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
