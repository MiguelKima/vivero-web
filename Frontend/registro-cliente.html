<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Clientes - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD -->
    <script>
        if (!localStorage.getItem('usuarioLogueado')) {
            window.location.replace('/'); 
        }
    </script>

    <style>
        .email-container {
            position: relative;
        }
        .email-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 99;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
        .email-suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
        }
        .email-suggestion-item:hover {
            background-color: #f1f3f5;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nuevo Cliente</h2>
            <form onsubmit="guardarCliente(event)">
                <div class="form-group">
                    <label>Nombre del Cliente:</label>
                    <input type="text" id="nom_cli" required placeholder="Ej. Maria Lopez">
                </div>
                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" id="dir_cli" placeholder="Ej. Insurgentes Sur 400">
                </div>
                <div class="form-group">
                    <label>Teléfono:</label>
                    <input type="text" id="tel_cli" placeholder="Ej. 5512345678">
                </div>
                
                <div class="form-group email-container">
                    <label>Correo Electrónico:</label>
                    <input type="text" id="cor_cli" autocomplete="off" placeholder="Ej. correo@dominio.com" oninput="manejarInputCorreo(this)">
                    <div id="sugerenciasCorreo" class="email-suggestions"></div>
                </div>

                <div class="form-group">
                    <label>Comentarios:</label>
                    <input type="text" id="com_cli" placeholder="Ej. Cliente frecuente">
                </div>
                <div class="form-group">
                    <label>Preferencia:</label>
                    <input type="text" id="pref_cli" placeholder="Ej. Plantas de sombra">
                </div>
                <button type="submit">Guardar Cliente</button>
            </form>
        </div>
    </div>

    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;
        const dominiosComunes = ["@gmail.com", "@hotmail.com", "@outlook.com", "@yahoo.com", "@icloud.com", "@live.com"];

        function manejarInputCorreo(input) {
            const valor = input.value;
            const cajaSugerencias = document.getElementById('sugerenciasCorreo');
            
            if (valor.includes('@')) {
                const partes = valor.split('@');
                const usuario = partes[0];
                const dominioEscrito = partes[1].toLowerCase();

                const filtrados = dominiosComunes.filter(d => d.substring(1).startsWith(dominioEscrito));

                if (filtrados.length > 0 && dominioEscrito !== '') {
                    cajaSugerencias.innerHTML = '';
                    filtrados.forEach(dom => {
                        const item = document.createElement('div');
                        item.className = 'email-suggestion-item';
                        item.innerText = usuario + dom;
                        item.onclick = function() {
                            input.value = usuario + dom;
                            cajaSugerencias.style.display = 'none';
                        };
                        cajaSugerencias.appendChild(item);
                    });
                    cajaSugerencias.style.display = 'block';
                } else {
                    cajaSugerencias.style.display = 'none';
                }
            } else if (valor.length > 0) {
                cajaSugerencias.innerHTML = '';
                dominiosComunes.forEach(dom => {
                    const item = document.createElement('div');
                    item.className = 'email-suggestion-item';
                    item.innerText = valor + dom;
                    item.onclick = function() {
                        input.value = valor + dom;
                        cajaSugerencias.style.display = 'none';
                    };
                    cajaSugerencias.appendChild(item);
                });
                cajaSugerencias.style.display = 'block';
            } else {
                cajaSugerencias.style.display = 'none';
            }
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.email-container')) {
                document.getElementById('sugerenciasCorreo').style.display = 'none';
            }
        });

        function guardarCliente(event) {
            event.preventDefault();
            const datos = {
                nom_cli: document.getElementById('nom_cli').value,
                dir_cli: document.getElementById('dir_cli').value,
                tel_cli: document.getElementById('tel_cli').value,
                cor_cli: document.getElementById('cor_cli').value,
                com_cli: document.getElementById('com_cli').value,
                pref_cli: document.getElementById('pref_cli').value
            };

            fetch('/api/clientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso de Duplicidad";
                    document.getElementById('textoModal').innerText = data.error || "Este cliente ya se encuentra registrado.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error de Servidor";
                document.getElementById('textoModal').innerText = "Error de comunicación con la base de datos.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
