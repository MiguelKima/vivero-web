<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Empleados - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD -->
    <script>
        if (!localStorage.getItem('usuarioLogueado')) {
            window.location.replace('/'); 
        }
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nuevo Empleado</h2>
            <form onsubmit="guardarEmpleado(event)">
                
                <div class="form-group">
                    <label>Tipo de Empleado:</label>
                    <select id="tip_emp" required>
                        <option value="">Seleccione una opción...</option>
                        <option value="Base">De Base / Planta</option>
                        <option value="Eventual">Eventual / Temporal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CURP:</label>
                    <input type="text" id="curp_emp" maxlength="18" required placeholder="Ej. KILM000000XXXXXX00">
                </div>

                <div class="form-group">
                    <label>Nombre del Empleado:</label>
                    <input type="text" id="nom_emp" required placeholder="Ej. Miguel">
                </div>

                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" id="dir_emp" required placeholder="Ej. CDMX">
                </div>

                <div class="form-group">
                    <label>Puesto:</label>
                    <select id="pue_emp" required>
                        <option value="">Seleccione el puesto...</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Cajero">Cajero/a</option>
                        <option value="Jardinero">Jardinero/a</option>
                        <option value="Repartidor">Repartidor/a</option>
                        <option value="Vendedor">Ventas / Atención al Cliente</option>
                        <option value="Encargado de Inventario">Encargado/a de Inventario</option>
                        <option value="Agrónomo">Agrónomo / Especialista en Plantas</option>
                        <option value="Mantenimiento">Personal de Mantenimiento</option>
                    </select>
                </div>

                <!-- CAMPO MODIFICADO A SELECT -->
                <div class="form-group">
                    <label>Horario:</label>
                    <select id="hor_emp" required>
                        <option value="">Seleccione el turno...</option>
                        <option value="Matutino">Matutino (Mañana)</option>
                        <option value="Vespertino">Vespertino (Tarde)</option>
                        <option value="Tiempo Completo">Tiempo Completo (Mixto)</option>
                        <option value="Fines de Semana">Fines de Semana</option>
                        <option value="Nocturno">Nocturno (Velador / Seguridad)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sueldo ($):</label>
                    <input type="number" id="sue_emp" step="0.01" required placeholder="0.00">
                </div>
                
                <button type="submit">Guardar Empleado</button>
            </form>
        </div>
    </div>

    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;

        function guardarEmpleado(event) {
            event.preventDefault();
            const datos = {
                tip_emp: document.getElementById('tip_emp').value,
                curp_emp: document.getElementById('curp_emp').value,
                nom_emp: document.getElementById('nom_emp').value,
                dir_emp: document.getElementById('dir_emp').value,
                pue_emp: document.getElementById('pue_emp').value,
                hor_emp: document.getElementById('hor_emp').value,
                sue_emp: document.getElementById('sue_emp').value
            };

            fetch('/api/empleados', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso de Duplicidad";
                    document.getElementById('textoModal').innerText = data.error || "Este empleado ya se encuentra registrado.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error de Servidor";
                document.getElementById('textoModal').innerText = "Error de comunicación con la base de datos.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
