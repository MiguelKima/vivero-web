<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Empleados - Vivero</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- GUARDIÁN DE SEGURIDAD Y PERMISOS (CU-6 / CU-18 / RN-34 / RN-35) -->
    <script>
        if (!localStorage.getItem('usuarioLogueado')) {
            window.location.replace('/'); 
        }
        window.addEventListener('pageshow', function(event) {
            if (!localStorage.getItem('usuarioLogueado')) {
                window.location.replace('/'); 
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            const rol = localStorage.getItem('rolUsuario');
            const esAdmin = rol && (rol.toLowerCase() === 'admin' || rol.toLowerCase() === 'administrador');
            if (!esAdmin) {
                document.querySelectorAll('nav a[href="registro-empleado.html"], nav a[href="registro-usuario.html"], nav a[href="registro-catalogo-servicio.html"]').forEach(el => el.style.display = 'none');
                const adminCont = document.querySelector('.admin-container') || document.querySelector('form');
                if (adminCont) adminCont.style.display = 'none';
                mostrarModalAcceso(
                    "Acceso No Autorizado",
                    "Se requieren privilegios de Administrador para gestionar empleados.",
                    function() {
                        window.location.replace('dashboard.html');
                    }
                );
            }
        });
    </script>
</head>
<body>
    <header>
        <h1>Sistema de Administración | Vivero</h1>
        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="registro-proveedor.html">Proveedores</a>
            <a href="registro-cliente.html">Clientes</a>
            <a href="registro-empleado.html">Empleados</a>
            <a href="registro-catalogo-servicio.html">Catálogo Servicios</a>
            <a href="registro-producto.html">Productos</a>
            <a href="registro-planta.html">Plantas</a>
            <a href="registro-pedido.html">Pedidos</a>
            <a href="registro-venta.html">Ventas</a>
            <a href="registro-servicio.html">Servicios</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ff8fab;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Alta de Nuevo Empleado</h2>
            <form onsubmit="guardarEmpleado(event)">
                
                <div class="form-group">
                    <label>Tipo de Empleado:</label>
                    <select id="tip_emp">
                        <option value="">Seleccione una opción (Opcional)...</option>
                        <option value="Base">De Base / Planta</option>
                        <option value="Eventual">Eventual / Temporal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CURP (Opcional):</label>
                    <input type="text" id="curp_emp" maxlength="18" placeholder="Ej. KILM000000XXXXXX00">
                </div>

                <div class="form-group">
                    <label>Nombre del Empleado:</label>
                    <input type="text" id="nom_emp" required maxlength="150" placeholder="Ej. Miguel">
                </div>

                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" id="dir_emp" placeholder="Ej. CDMX">
                </div>

                <div class="form-group">
                    <label>Puesto:</label>
                    <select id="pue_emp">
                        <option value="">Seleccione el puesto (Opcional)...</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Cajero">Cajero/a</option>
                        <option value="Jardinero">Jardinero/a</option>
                        <option value="Repartidor">Repartidor/a</option>
                        <option value="Vendedor">Ventas / Atención al Cliente</option>
                        <option value="Encargado de Inventario">Encargado/a de Inventario</option>
                        <option value="Agrónomo">Agrónomo / Especialista en Plantas</option>
                        <option value="Mantenimiento">Personal de Mantenimiento</option>
                    </select>
                </div>

                <!-- CAMPO MODIFICADO A SELECT -->
                <div class="form-group">
                    <label>Horario:</label>
                    <select id="hor_emp">
                        <option value="">Seleccione el turno (Opcional)...</option>
                        <option value="Matutino">Matutino (Mañana)</option>
                        <option value="Vespertino">Vespertino (Tarde)</option>
                        <option value="Tiempo Completo">Tiempo Completo (Mixto)</option>
                        <option value="Fines de Semana">Fines de Semana</option>
                        <option value="Nocturno">Nocturno (Velador / Seguridad)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sueldo ($):</label>
                    <input type="number" id="sue_emp" step="0.01" min="0" placeholder="0.00">
                </div>
                
                <button type="submit">Guardar Empleado</button>
            </form>
        </div>
    </div>

    <div id="modalMensaje" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="tituloModal">Aviso del Sistema</h3>
            <p id="textoModal">Mensaje informativo.</p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let esExito = false;
        let modalAccesoCallback = null;

        function mostrarModalAcceso(titulo, mensaje, onCerrar) {
            const modal = document.getElementById('modalMensaje');
            if (modal) {
                document.getElementById('tituloModal').innerText = titulo;
                document.getElementById('textoModal').innerText = mensaje;
                modalAccesoCallback = onCerrar || null;
                modal.style.display = 'flex';
            }
        }

        function guardarEmpleado(event) {
            event.preventDefault();
            // Validación con trim() para evitar nombres vacíos o solo con espacios (CU-15 / RN-12)
            const nom_emp = document.getElementById('nom_emp').value.trim();

            if (!nom_emp) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Validación";
                document.getElementById('textoModal').innerText = "El nombre del empleado es obligatorio y no puede estar vacío ni contener solo espacios.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            // Validación de longitud máxima (CU-16 / RN-19: NOM_EMP VARCHAR(150))
            if (nom_emp.length > 150) {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Longitud Excedida";
                document.getElementById('textoModal').innerText = "El nombre del empleado no puede exceder los 150 caracteres.";
                document.getElementById('modalMensaje').style.display = 'flex';
                return;
            }

            const sueVal = document.getElementById('sue_emp').value;
            let sueldoNum = null;

            if (sueVal !== '') {
                sueldoNum = parseFloat(sueVal);
                // Validación de sueldo mayor a 0 (el sueldo no puede ser 0 pesos)
                if (isNaN(sueldoNum) || sueldoNum <= 0) {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Valor Inválido";
                    document.getElementById('textoModal').innerText = "El sueldo del empleado debe ser mayor a 0 ($0.00 no permitido).";
                    document.getElementById('modalMensaje').style.display = 'flex';
                    return;
                }
                sueldoNum = Math.round((sueldoNum + Number.EPSILON) * 100) / 100;
            }

            const curpVal = document.getElementById('curp_emp').value.trim();

            const datos = {
                tip_emp: document.getElementById('tip_emp').value || null,
                curp_emp: curpVal ? curpVal.toUpperCase() : null,
                nom_emp: nom_emp,
                dir_emp: document.getElementById('dir_emp').value.trim() || null,
                pue_emp: document.getElementById('pue_emp').value || null,
                hor_emp: document.getElementById('hor_emp').value || null,
                sue_emp: sueldoNum,
                rol_solicitante: localStorage.getItem('rolUsuario') || '',
                usuarioLogueado: localStorage.getItem('usuarioLogueado') || ''
            };

            fetch('/api/empleados', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-rol-usuario': localStorage.getItem('rolUsuario') || '',
                    'x-usuario': localStorage.getItem('usuarioLogueado') || ''
                },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.exito) {
                    esExito = true;
                    document.getElementById('tituloModal').innerText = "Registro Exitoso";
                    document.getElementById('textoModal').innerText = data.mensaje;
                } else {
                    esExito = false;
                    document.getElementById('tituloModal').innerText = "Aviso";
                    document.getElementById('textoModal').innerText = data.error || "No se pudo registrar el empleado.";
                }
                document.getElementById('modalMensaje').style.display = 'flex';
            })
            .catch(err => {
                esExito = false;
                document.getElementById('tituloModal').innerText = "Error de Servidor";
                document.getElementById('textoModal').innerText = "Error de comunicación con la base de datos.";
                document.getElementById('modalMensaje').style.display = 'flex';
            });
        }

        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
            if (modalAccesoCallback) {
                const cb = modalAccesoCallback;
                modalAccesoCallback = null;
                cb();
                return;
            }
            if(esExito) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
